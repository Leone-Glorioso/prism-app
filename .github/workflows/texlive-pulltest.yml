name: texlive medium probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir w && cd w
          printf '\documentclass{article}\begin{document}hi\end{document}\n' > t.tex
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/home -v "$PWD:/work" -w /work texlive/texlive:latest-medium bash -c 'echo "HOME=$HOME"; mkdir -p "$HOME"; which latexmk perl pdflatex biber; latexmk -pdf -interaction=nonstopmode t.tex; echo EXIT=$?; for f in fontspec.sty biblatex.sty polyglossia.sty xcolor.sty; do echo "$f: $(kpsewhich $f)"; done' 2>&1 | tail -30
