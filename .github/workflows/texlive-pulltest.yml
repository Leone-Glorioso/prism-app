name: texlive medium probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir w && cd w
          cat > t.tex <<'T'
          \documentclass{article}
          \begin{document}
          hi
          \end{document}
          T
          sed -i 's/^ *//' t.tex
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -e HOME=/tmp/home -v "$PWD:/work" -w /work texlive/texlive:latest-medium bash -c 'mkdir -p "$HOME"; latexmk -norc -f -interaction=nonstopmode -file-line-error -synctex=1 -pdf t.tex 2>&1 | tail -15; echo ---; which perl jq 2>&1'
