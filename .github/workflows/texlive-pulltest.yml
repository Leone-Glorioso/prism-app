name: texlive pull test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Pull sizes
        run: |
          for tag in latest-small latest-medium; do
            s=$(date +%s); docker pull -q texlive/texlive:$tag >/dev/null; echo "PULL $tag SECONDS: $(( $(date +%s) - s ))"
          done
          docker images texlive/texlive --format '{{.Tag}} {{.Size}}'
