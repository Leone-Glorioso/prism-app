name: compile
run-name: "compile ${{ inputs.project }} [${{ inputs.request }}]"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name exactly as in prism-projects.json
        required: true
        type: string
      request:
        description: Request id set by the web app to find this run (any text)
        required: false
        type: string
        default: manual

# One compile per project at a time; a newer request for the same project replaces an older one.
concurrency:
  group: compile-${{ inputs.project }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # persist-credentials: false keeps the job token out of .git/config, which the compile container can read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Compiler settings live in prism-compiler.json (edited in the web app, no workflow change needed):
      #   "texlive": "latest" or a year 2013..2029 (official texlive/texlive image of that year), "timeoutMinutes": 1..40.
      # Only these validated values reach the next step; anything else falls back to the defaults.
      - name: Read compiler settings
        id: cfg
        run: |
          texlive=latest
          minutes=30
          if [ -f prism-compiler.json ]; then
            t="$(jq -r '.texlive // empty' prism-compiler.json 2>/dev/null || true)"
            m="$(jq -r '.timeoutMinutes // empty' prism-compiler.json 2>/dev/null || true)"
            if [[ "$t" =~ ^(latest|20(1[3-9]|2[0-9]))$ ]]; then texlive="$t"
            elif [ -n "$t" ]; then echo "::warning::Ignoring an invalid texlive value in prism-compiler.json; using latest"; fi
            if [[ "$m" =~ ^[0-9]+$ ]] && [ "$m" -ge 1 ] && [ "$m" -le 40 ]; then minutes="$m"
            elif [ -n "$m" ]; then echo "::warning::Ignoring an invalid timeoutMinutes in prism-compiler.json; using 30"; fi
          fi
          if [ "$texlive" = latest ]; then image="texlive/texlive:latest"; else image="texlive/texlive:TL${texlive}-historic"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "seconds=$((minutes * 60))" >> "$GITHUB_OUTPUT"
          echo "TeX Live image: $image; time limit: $minutes minutes"

      # The project's TeX code is untrusted input: run it with no network, no privileges and no job secrets.
      # Speed: the full TeX Live image takes about 90 seconds to download, the "medium" one about 15. With the
      # default "latest" setting a project is tried on the medium image first; only when the log shows a missing
      # package, class or font is it compiled again on the full image, and later builds of that project start with the
      # full image. Frozen years always use the full image.
      - name: Compile in TeX Live container
        env:
          PROJECT: ${{ inputs.project }}
          TEXLIVE_IMAGE: ${{ steps.cfg.outputs.image }}
          TIME_LIMIT_SECONDS: ${{ steps.cfg.outputs.seconds }}
          GH_TOKEN: ${{ github.token }} # used by this step only, never passed into the container
        run: |
          run_in() { # image, label written into result.json
            rm -rf .prism-out
            # max_print_line etc.: unwrapped log lines, so file:line errors are not split across lines.
            docker run --rm \
              --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 1024 --memory 6g \
              --user "$(id -u):$(id -g)" -e HOME=/tmp/home \
              -e PROJECT -e GITHUB_SHA -e GITHUB_RUN_ID -e TEXLIVE_IMAGE="${2:-$1}" -e COMPILE_TIMEOUT_SECONDS="$TIME_LIMIT_SECONDS" \
              -e max_print_line=10000 -e error_line=254 -e half_error_line=238 \
              -v "$GITHUB_WORKSPACE:/work" -w /work "$1" \
              bash .github/scripts/compile.sh "$PROJECT" /work/.prism-out
          }
          missing='(File|file) .{0,100}\.(sty|cls|def|cfg|fd|tfm|bst|bbx|cbx|lbx|ldf|clo|pfb|otf|ttf|enc|map).{0,3} not found|I can.t find file .{0,100}\.(sty|cls|tfm|bst)|cannot be found|pygmentize|kpathsea: Running mktex|Package fontspec Error|No hyphenation patterns'
          # A project that needed the full image last time goes straight to it.
          id="$(printf '%s' "$PROJECT" | sha1sum | cut -c1-12)"
          prev="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/result.json?ref=builds/$id" 2>/dev/null | jq -r '.image // empty' 2>/dev/null || true)"
          if [ "$TEXLIVE_IMAGE" = "texlive/texlive:latest" ] && [ "$prev" != "texlive/texlive:latest+full" ]; then
            run_in texlive/texlive:latest-medium
            status="$(jq -r .status .prism-out/result.json 2>/dev/null || echo error)"
            if [ "$status" = ok ] || ! grep -qE "$missing" .prism-out/output.log 2>/dev/null; then
              echo "Compiled on the medium image (status: $status)"
              exit 0
            fi
            echo "Something is missing on the medium image; compiling again on the full image"
          fi
          if [ "$TEXLIVE_IMAGE" = "texlive/texlive:latest" ]; then run_in "$TEXLIVE_IMAGE" "texlive/texlive:latest+full"; else run_in "$TEXLIVE_IMAGE"; fi

      - name: Publish result to builds branch
        env:
          PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(printf '%s' "$PROJECT" | sha1sum | cut -c1-12)"
          branch="builds/$id"
          cd .prism-out
          rm -f latexmk.txt
          git init -q
          git config user.name "prism-compile"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of $PROJECT at $GITHUB_SHA"
          # Single commit per project, replaced on every build, so PDFs do not pile up in history.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          echo "Published to $branch"
          cat result.json
